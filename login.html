<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy — Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- ============================ NAVIGATION BAR ============================ -->
    <header class="navbar">
        <div class="nav-left">
            <a href="explore.html" class="logo">Study<span>Buddy</span></a>
        </div>
    </header>

    <!-- ============================ LOGIN FORM ============================ -->
    <main class="auth-wrap">
        <div class="auth-left">
        <section class="auth-card">
            <h1 class="auth-title">LOGIN</h1>
            <p class="auth-subtitle">Welcome back — sign in to continue learning.</p>

            <form class="auth-form" action="explore.html" method="get">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
                </div>

                <!-- Simulated login: link navigates to the Explore page -->
                <a href="explore.html" class="auth-submit">LOGIN</a>
            </form>

            <p class="auth-footer">Don't have an account? <a href="register.html">Register</a></p>
        </section>
        </div>

        <!-- Right-side area (plain, reserved for future content) -->
        <aside class="auth-side" aria-hidden="true"></aside>
    </main>

</body>
</html>
